
name: Syslatech Website Monitoring

on:
  schedule:
    # Run every 15 minutes
    - cron: "*/15 * * * *"

  # Allow manual testing from GitHub
  workflow_dispatch:

  # Run a check when monitoring code is pushed to lasya
  push:
    branches:
      - lasya
    paths:
      - "scripts/monitor.mjs"
      - ".github/workflows/monitor.yml"

permissions:
  contents: read

jobs:
  monitor:
    name: Check website health
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monitor Syslatech website
        run: node scripts/monitor.mjs
        env:
          MONITOR_URL: https://lasya365.github.io/Syslatech-demo/
